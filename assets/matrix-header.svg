<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260">
  <style>

    @keyframes fall {
      0% {
        transform: translateY(-300px);
      }
      100% {
        transform: translateY(580px);
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; text-shadow: 0 0 8px #00ff00, 0 0 15px #00ff00, 0 0 30px #00ff00; }
      50% { opacity: 1; text-shadow: 0 0 12px #00ff00, 0 0 25px #00ff00, 0 0 40px #00ff00, 0 0 10px #ffffff; }
    }
    @keyframes scanline {
      0% { transform: translateY(-260px); }
      100% { transform: translateY(260px); }
    }
    .matrix-col {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      animation: fall linear infinite;
    }
    .glow-text {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-weight: 800;
      fill: #ffffff;
      animation: pulse 4s ease-in-out infinite;
    }
    .sub-text {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      fill: #00ff00;
      font-weight: 600;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #00ff00;
    }
    .border-glow {
      stroke: #00ff00;
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 3px #00ff00);
      opacity: 0.7;
    }
    </style>
